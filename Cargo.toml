[package]
name = "nofetch"
version = "0.1.0"
edition = "2024"

[dependencies]
colored = "3.1.1"
clap = { version = "4.6.1", features = ["derive"] }
directories = "6.0.0"
serde_json = "1.0.149"
sysinfo = "0.38.4"
image = "0.25.10"
regex = "1.12.3"
mlua = { version = "0.11.6", features = ["lua54", "vendored"] }

[target.'cfg(target_os = "windows")'.dependencies]
viuer = { version = "0.11.0", features = ["print-file", "sixel"] }
windows-sys = { version = "0.61", features = [
  "Win32_Graphics_Gdi",
  "Win32_Foundation",
  "Win32_System_Registry",
] }

[target.'cfg(not(target_os = "windows"))'.dependencies]
viuer = { version = "0.11.0", features = ["print-file"] }
